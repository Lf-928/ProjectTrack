<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --board-bg:#d9c19a;
  --speckle-1:#c9a978;
  --speckle-2:#e9d6ac;
  --header-1:#4a3524;
  --header-2:#20150c;
  --header-text:#f5e7c9;
  --note-1:#fff3b0;
  --note-2:#ffd3e0;
  --note-3:#c8f4de;
  --note-4:#c7e6ff;
  --note-5:#e3d4ff;
  --note-6:#ffe0b3;
  --ink:#2c241a;
  --ink-soft:#5c5140;
  --primary-1:#6fa3ff;
  --primary-2:#2f62d6;
  --danger-1:#ff8b8b;
  --danger-2:#d9433f;
  --success-1:#8fe0a8;
  --success-2:#379a5c;
  --paper:#fffaf0;
  --paper-edge:#e8dcc0;
  --pin:#c23b3b;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Baloo 2', sans-serif;
  color:var(--ink);
  min-height:100vh;
  background-color:var(--board-bg);
  background-image:
    radial-gradient(circle, var(--speckle-1) 1px, transparent 1.4px),
    radial-gradient(circle, var(--speckle-2) 1.2px, transparent 1.6px);
  background-size: 26px 26px, 41px 41px;
  background-position: 0 0, 13px 19px;
  padding-bottom:60px;
}

/* ---------- Header ---------- */
header.board-header{
  position:relative;
  margin:14px 14px 18px;
  padding:16px 22px;
  border-radius:16px;
  background:linear-gradient(180deg, var(--header-1), var(--header-2));
  box-shadow:0 6px 14px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.35);
  color:var(--header-text);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
header.board-header::before, header.board-header::after{
  content:"";
  position:absolute;
  top:10px;
  width:8px;height:8px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #ddd, #777 70%, #333);
  box-shadow:0 1px 2px rgba(0,0,0,.6);
}
header.board-header::before{left:14px;}
header.board-header::after{right:14px;}
.board-title{
  font-family:'Kalam', cursive;
  font-weight:700;
  font-size:1.7rem;
  letter-spacing:.3px;
  text-shadow:0 1px 0 rgba(255,255,255,.45);
}
.header-stats{
  display:flex;
  gap:18px;
  font-size:.85rem;
  opacity:.9;
  flex-wrap:wrap;
}
.header-stats b{font-size:1.05rem;display:block;font-family:'Baloo 2';}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* ---------- Tabs ---------- */
nav.tabbar{
  display:flex;
  gap:8px;
  margin:0 14px 18px;
  flex-wrap:wrap;
  align-items:center;
}
.tab-btn{
  font-family:'Baloo 2';
  font-weight:600;
  font-size:.92rem;
  padding:9px 16px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  background:rgba(255,255,255,.55);
  color:var(--ink);
  box-shadow:0 2px 0 rgba(0,0,0,.15);
  transition:transform .12s ease, background .15s ease;
}
.tab-btn:hover{transform:translateY(-1px);}
.tab-btn.active{
  background:linear-gradient(180deg, var(--primary-1), var(--primary-2));
  color:#fff;
  box-shadow:0 3px 0 var(--primary-2);
}
.tab-spacer{flex:1;}

/* ---------- Jelly buttons ---------- */
.jelly{
  --c1:var(--primary-1); --c2:var(--primary-2);
  font-family:'Baloo 2';
  font-weight:700;
  font-size:.9rem;
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.45);
  border:none;
  padding:10px 20px;
  border-radius:999px;
  cursor:pointer;
  position:relative;
  background:linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow:0 5px 0 color-mix(in srgb, var(--c2) 70%, black), 0 8px 14px rgba(0,0,0,.2);
  transform:translateY(0);
  transition:transform .08s ease, box-shadow .08s ease;
}
.jelly::after{
  content:"";
  position:absolute;
  top:3px;left:10%;right:10%;
  height:36%;
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0));
  pointer-events:none;
}
.jelly:active{
  transform:translateY(5px);
  box-shadow:0 0 0 color-mix(in srgb, var(--c2) 70%, black), 0 2px 4px rgba(0,0,0,.2);
}
.jelly.small{padding:6px 14px;font-size:.8rem;}
.jelly.danger{--c1:var(--danger-1); --c2:var(--danger-2);}
.jelly.success{--c1:var(--success-1); --c2:var(--success-2);}
.jelly.ghost{
  background:rgba(255,255,255,.5);
  color:var(--ink);
  box-shadow:0 4px 0 rgba(0,0,0,.15);
}
.jelly.ghost:active{box-shadow:0 0 0 rgba(0,0,0,.15);}
.jelly:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- Main container ---------- */
main{margin:0 14px;}
.panel{
  background:rgba(255,250,240,.55);
  border-radius:16px;
  padding:16px;
  margin-bottom:18px;
}
h2.section-title{
  font-family:'Kalam', cursive;
  font-size:1.3rem;
  margin:2px 0 12px;
  color:var(--ink);
}

/* ---------- Needs attention ---------- */
.attn-list{display:flex;flex-direction:column;gap:8px;}
.attn-item{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  transition:transform .1s ease;
}
.attn-item:hover{transform:translateX(3px);}
.tag{
  font-size:.72rem;
  font-weight:700;
  padding:3px 9px;
  border-radius:999px;
  color:#fff;
  flex-shrink:0;
}
.tag.tag-task{background:var(--primary-2);}
.tag.tag-reminder{background:#b8862f;}
.tag.tag-goal{background:var(--success-2);}
.attn-text{flex:1;font-size:.9rem;}
.badge{
  font-size:.72rem;
  font-weight:700;
  padding:2px 8px;
  border-radius:999px;
  background:#eee;
  color:#555;
  flex-shrink:0;
}
.badge.overdue{background:var(--danger-2);color:#fff;}
.empty-msg{font-size:.9rem;color:var(--ink-soft);font-style:italic;padding:6px 2px;}

/* ---------- Sticky notes / project cards ---------- */
.note-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
  gap:26px 22px;
  padding-top:6px;
}
.sticky{
  position:relative;
  padding:18px 16px 14px;
  border-radius:3px;
  cursor:pointer;
  min-height:130px;
  box-shadow:3px 6px 10px rgba(0,0,0,.25);
  transition:transform .15s ease, box-shadow .15s ease;
  font-family:'Kalam', cursive;
  color:#3a3226;
}
.sticky .pin{
  position:absolute;
  top:-14px;left:50%;
  transform:translateX(-50%);
  font-size:1.3rem;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));
}
.sticky:hover{
  transform:rotate(0deg) translateY(-4px) scale(1.02);
  box-shadow:5px 10px 16px rgba(0,0,0,.3);
  z-index:2;
}
.sticky h3{margin:6px 0 10px;font-size:1.15rem;font-weight:700;}
.sticky .note-sub{font-family:'Baloo 2';font-size:.82rem;color:#4a4232;margin-bottom:8px;}
.progress-track{
  background:rgba(0,0,0,.15);
  border-radius:999px;
  height:9px;
  overflow:hidden;
}
.progress-fill{height:100%;border-radius:999px;background:#3a3226;opacity:.55;}
.overdue-flag{
  position:absolute;
  top:8px;right:8px;
  background:var(--danger-2);
  color:#fff;
  font-family:'Baloo 2';
  font-weight:700;
  font-size:.7rem;
  padding:2px 7px;
  border-radius:999px;
}

/* ---------- Project detail ---------- */
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.detail-header h2{font-family:'Kalam';font-size:1.5rem;margin:0;flex:1;min-width:140px;}
.task-add-row{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:10px;
  padding:10px;
  margin-bottom:14px;
}
.task-add-row input[type=text]{flex:2;min-width:160px;}
input,select{
  font-family:'Baloo 2';
  font-size:.88rem;
  padding:7px 10px;
  border-radius:8px;
  border:1px solid #d8cbb0;
  background:#fff;
  color:var(--ink);
}
label.chk{display:flex;align-items:center;gap:5px;font-size:.85rem;}
.task-list{display:flex;flex-direction:column;gap:7px;}
.task-row{
  display:flex;align-items:center;gap:10px;
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:9px;
  padding:9px 12px;
}
.task-row.done .task-text{text-decoration:line-through;opacity:.5;}
.task-text{flex:1;font-size:.9rem;}
.pill{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;}
.pill.urgent{background:var(--danger-2);color:#fff;}
.icon-btn{
  background:none;border:none;cursor:pointer;font-size:1rem;
  opacity:.6;transition:opacity .1s;
}
.icon-btn:hover{opacity:1;}

/* ---------- This Week ---------- */
.week-summary{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.summary-chip{
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:12px;
  padding:10px 16px;
  text-align:center;
  min-width:110px;
}
.summary-chip b{display:block;font-size:1.3rem;font-family:'Kalam';}
.summary-chip span{font-size:.75rem;color:var(--ink-soft);}
.week-grid{display:flex;flex-direction:column;gap:10px;}
.day-row{
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:10px;
  padding:10px 14px;
}
.day-row h4{margin:0 0 6px;font-family:'Kalam';font-size:1.05rem;}
.day-items{display:flex;flex-direction:column;gap:5px;}
.day-item{font-size:.85rem;display:flex;align-items:center;gap:8px;cursor:pointer;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* ---------- Calendar ---------- */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav h3{font-family:'Kalam';font-size:1.25rem;margin:0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-weekday{text-align:center;font-size:.75rem;font-weight:700;color:var(--ink-soft);padding-bottom:4px;}
.cal-cell{
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:8px;
  min-height:64px;
  padding:5px 6px;
  cursor:pointer;
  font-size:.78rem;
  position:relative;
}
.cal-cell.faded{opacity:.4;}
.cal-cell.today{outline:2px solid var(--primary-2);outline-offset:-2px;}
.cal-cell .dnum{font-weight:700;}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;}
.cal-detail{margin-top:14px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:10px;padding:12px;}
.cal-detail-item{font-size:.85rem;padding:5px 0;border-bottom:1px dashed var(--paper-edge);cursor:pointer;}
.cal-detail-item:last-child{border-bottom:none;}

/* ---------- Weight & Shots shared ---------- */
.card-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.card{
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:12px;
  padding:14px 16px;
  flex:1;
  min-width:260px;
}
.streak-badge{
  display:inline-block;
  background:linear-gradient(180deg,#ffcf7a,#e6982a);
  color:#4a2c00;
  font-weight:700;
  font-size:.8rem;
  padding:4px 12px;
  border-radius:999px;
  margin-left:8px;
  box-shadow:0 2px 0 rgba(0,0,0,.15);
}
.field-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.field-row label{font-size:.8rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px;}
details.measure-toggle{margin:6px 0;}
details.measure-toggle summary{cursor:pointer;font-size:.85rem;color:var(--primary-2);font-weight:600;}
.measure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px;}
.measure-grid label{font-size:.72rem;}

table.log-table{width:100%;border-collapse:collapse;font-size:.83rem;margin-top:10px;}
table.log-table th, table.log-table td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--paper-edge);}
table.log-table th{color:var(--ink-soft);font-size:.72rem;text-transform:none;}

.chart-wrap{margin-top:8px;}
.chart-wrap svg{width:100%;height:140px;}

/* ---------- Goal card ---------- */
.goal-progress-wrap{margin-top:8px;}
.goal-progress-track{background:rgba(0,0,0,.1);border-radius:999px;height:14px;overflow:hidden;}
.goal-progress-fill{height:100%;background:linear-gradient(90deg,var(--success-1),var(--success-2));}

/* ---------- Shot tracker ---------- */
.shot-tip{
  font-size:.83rem;
  color:var(--ink-soft);
  background:#fff8e0;
  border:1px dashed #d8bf7a;
  border-radius:10px;
  padding:8px 12px;
  margin-bottom:12px;
}
.shot-svg-wrap{position:relative;width:100%;max-width:320px;margin:0 auto;}
.shot-dot{cursor:pointer;}
.shot-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;margin-top:10px;}
.shot-list-item{
  display:flex;align-items:center;gap:8px;
  background:#fff;border:1px solid var(--paper-edge);border-radius:8px;padding:7px 10px;font-size:.82rem;
}
.shot-list-item .meta{flex:1;}
.dose-history-item{font-size:.82rem;padding:5px 0;border-bottom:1px dashed var(--paper-edge);}
.dose-history-item:last-child{border-bottom:none;}

/* ---------- Goals tab rows ---------- */
.goal-row{
  background:var(--paper);border:1px solid var(--paper-edge);border-radius:10px;
  padding:12px 14px;margin-bottom:10px;
}
.goal-row.completed{opacity:.55;}
.goal-row.completed .goal-title{text-decoration:line-through;}
.goal-row-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.goal-title{font-family:'Kalam';font-size:1.05rem;flex:1;}
input[type=range]{width:100%;accent-color:var(--primary-2);}
.goal-pct{font-family:'Baloo 2';font-weight:700;font-size:.85rem;min-width:52px;text-align:right;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(20,14,6,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;
  padding:16px;
}
.modal-box{
  background:var(--paper);
  border-radius:16px;
  padding:20px 22px;
  max-width:420px;
  width:100%;
  max-height:88vh;
  overflow-y:auto;
  box-shadow:0 16px 40px rgba(0,0,0,.35);
  animation:pop-in .16s ease;
}
@keyframes pop-in{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-box h3{font-family:'Kalam';margin:0 0 12px;font-size:1.25rem;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.modal-field{margin-bottom:10px;display:flex;flex-direction:column;gap:4px;}
.modal-field label{font-size:.78rem;color:var(--ink-soft);font-weight:600;}
.modal-field input, .modal-field select{width:100%;}
.swatch-picker{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.swatch.selected{border-color:var(--ink);}

/* ---------- Theme picker ---------- */
.theme-grid{display:flex;flex-direction:column;gap:10px;}
.theme-opt{
  display:flex;align-items:center;gap:10px;
  border:2px solid var(--paper-edge);
  border-radius:10px;
  padding:8px 10px;
  cursor:pointer;
}
.theme-opt.active{border-color:var(--primary-2);background:rgba(111,163,255,.1);}
.theme-swatches{display:flex;gap:3px;}
.theme-swatches div{width:16px;height:16px;border-radius:4px;}
.theme-opt-name{font-weight:600;font-size:.9rem;flex:1;}

/* ---------- misc ---------- */
.back-btn{font-size:.85rem;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:4px;}

@media (max-width:600px){
  .board-title{font-size:1.3rem;}
  .header-stats{gap:10px;}
  .note-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
}

/* Note: paper/ink intentionally stay the same regardless of system
   dark-mode setting — this board has its own playful palette system
   (the Theme picker) rather than following OS light/dark preference. */
</style>
</head>
<body>

<header class="board-header">
  <div class="board-title">📌 Project Command Center</div>
  <div class="header-stats" id="headerStats"></div>
  <div class="header-right">
    <button class="jelly ghost small" onclick="openBackupModal()">💾 Backup</button>
    <button class="jelly ghost small" onclick="openThemeModal()">🎨 Theme</button>
  </div>
</header>

<nav class="tabbar" id="tabbar">
  <button class="tab-btn" data-tab="projects" onclick="switchTab('projects')">Projects</button>
  <button class="tab-btn" data-tab="week" onclick="switchTab('week')">This Week</button>
  <button class="tab-btn" data-tab="calendar" onclick="switchTab('calendar')">Calendar</button>
  <button class="tab-btn" data-tab="weight" onclick="switchTab('weight')">Weight &amp; Measurements</button>
  <button class="tab-btn" data-tab="shots" onclick="switchTab('shots')">Shot Tracker</button>
  <button class="tab-btn" data-tab="goals" onclick="switchTab('goals')">Goals</button>
</nav>

<main id="mainContent"></main>

<div id="modalRoot"></div>

<script>
/* =======================================================
   STATE
======================================================= */
const STORAGE_KEY = 'pcc_state_v1';
let state = null;

function defaultState(){
  return {
    projects: [],
    weight: { unit:'lb', goal:null, entries:[] },
    shots: { entries:[], doses:[] },
    goals: { entries:[] },
    theme: 'bulletin'
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(defaultState(), parsed);
      state.weight = Object.assign({unit:'lb',goal:null,entries:[]}, parsed.weight||{});
      state.shots = Object.assign({entries:[],doses:[]}, parsed.shots||{});
      state.goals = Object.assign({entries:[]}, parsed.goals||{});
    } else {
      state = defaultState();
    }
  }catch(e){
    console.error('Failed to load state', e);
    state = defaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Failed to save state', e);
  }
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

/* =======================================================
   THEMES
======================================================= */
const THEMES = {
  bulletin: {
    name:"Bulletin Board",
    vars:{
      '--board-bg':'#e8d3a9','--speckle-1':'#dcc088','--speckle-2':'#f2e2ba',
      '--header-1':'#f6d98a','--header-2':'#e0a94f','--header-text':'#5a3a15',
      '--note-1':'#fff3b0','--note-2':'#ffd3e0','--note-3':'#c8f4de','--note-4':'#c7e6ff','--note-5':'#e3d4ff','--note-6':'#ffe0b3',
      '--primary-1':'#4a84e0','--primary-2':'#1f4aa8',
      '--danger-1':'#e05c5c','--danger-2':'#b82e2e',
      '--success-1':'#4caf6e','--success-2':'#237a44'
    }
  },
  poolside: {
    name:"Poolside",
    vars:{
      '--board-bg':'#7dd3ec','--speckle-1':'#5cc0dd','--speckle-2':'#a3e6f5',
      '--header-1':'#ffcbb0','--header-2':'#ffa385','--header-text':'#7a2e10',
      '--note-1':'#ffe1cf','--note-2':'#ffd0dd','--note-3':'#c9fff0','--note-4':'#d0f0ff','--note-5':'#e6d8ff','--note-6':'#fff0b0',
      '--primary-1':'#f2703e','--primary-2':'#c9501f',
      '--danger-1':'#e05c5c','--danger-2':'#b82e2e',
      '--success-1':'#35b092','--success-2':'#1c6b58'
    }
  },
  citrus: {
    name:"Citrus Dusk",
    vars:{
      '--board-bg':'#b3aee3','--speckle-1':'#9f99d2','--speckle-2':'#c8c3ef',
      '--header-1':'#ffcda6','--header-2':'#ff9d54','--header-text':'#6b310a',
      '--note-1':'#ffd9a0','--note-2':'#ffb199','--note-3':'#ffe6cc','--note-4':'#d9c9ff','--note-5':'#ffcfe6','--note-6':'#ffe08a',
      '--primary-1':'#e06a1f','--primary-2':'#a84e14',
      '--danger-1':'#d9534f','--danger-2':'#a83530',
      '--success-1':'#4a9b68','--success-2':'#2c6b45'
    }
  },
  boardwalk: {

/* =======================================================
   GENERIC MODAL SYSTEM
======================================================= */
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

function showModal(title, bodyHtml, buttonsHtml){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <h3>${escapeHtml(title)}</h3>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-actions">${buttonsHtml}</div>
      </div>
    </div>`;
}

function confirmModal(message, onConfirm, opts){
  opts = opts || {};
  const okLabel = opts.okLabel || 'Delete';
  const danger = opts.danger !== false;
  showModal(opts.title || 'Are you sure?', `<p style="font-size:.9rem;line-height:1.5;">${escapeHtml(message)}</p>`,
    `<button class="jelly ghost small" onclick="closeModal()">Cancel</button>
     <button class="jelly ${danger?'danger':''} small" id="confirmOkBtn">${escapeHtml(okLabel)}</button>`);
  document.getElementById('confirmOkBtn').onclick = ()=>{ closeModal(); onConfirm(); };
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =======================================================
   DATE HELPERS
======================================================= */
function todayISO(){
  const d = new Date();
  return isoFromDate(d);
}
function isoFromDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateFromISO(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}
function daysBetween(isoA, isoB){
  const a = dateFromISO(isoA), b = dateFromISO(isoB);
  return Math.round((b-a) / 86400000);
}
function addDaysISO(iso, n){
  const d = dateFromISO(iso);
  d.setDate(d.getDate()+n);
  return isoFromDate(d);
}
function formatDateShort(iso){
  const d = dateFromISO(iso);
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}
function isOverdue(iso){
  return daysBetween(todayISO(), iso) < 0;
}

/* =======================================================
   COMPUTED HELPERS
======================================================= */
function projectProgress(p){
  if(!p.tasks.length) return {done:0,total:0,pct:0};
  const done = p.tasks.filter(t=>t.done).length;
  return {done, total:p.tasks.length, pct: Math.round(done/p.tasks.length*100)};
}
function projectOverdueCount(p){
  return p.tasks.filter(t=>!t.done && t.due && isOverdue(t.due)).length;
}
function allUrgentOrSoonTasks(){
  const items = [];
  state.projects.forEach(p=>{
    p.tasks.forEach(t=>{
      if(t.done) return;
      const soon = t.due && daysBetween(todayISO(), t.due) <= 2;
      if(t.urgent || soon){
        items.push({type:'task', project:p, task:t});
      }
    });
  });
  return items;
}
function soonGoals(){
  return state.goals.entries.filter(g=>{
    if(g.progress>=100) return false;
    if(!g.targetDate) return false;
    return daysBetween(todayISO(), g.targetDate) <= 2;
  });
}
function lastEntryDate(list){
  if(!list.length) return null;
  return list.reduce((max,e)=> e.date>max? e.date:max, list[0].date);
}
function shotReminder(){
  const last = lastEntryDate(state.shots.entries);
  if(!last){
    return {overdue:false, text:'Log your first GLP-1 shot', days:null};
  }
  const days = daysBetween(last, todayISO());
  if(days < 7) return null;
  return {overdue: days>=8, text:`Weekly shot due — last one was ${days} days ago`, days};
}
function weighReminder(){
  const last = lastEntryDate(state.weight.entries);
  if(!last){
    return {overdue:false, text:'Log your first weigh-in', days:null};
  }
  const days = daysBetween(last, todayISO());
  if(days < 7) return null;
  return {overdue: days>=8, text:`Weekly weigh-in due — last one was ${days} days ago`, days};
}
function computeStreak(entries){
  // consecutive 7-day windows walking back from today with at least one entry
  if(!entries.length) return 0;
  const dates = entries.map(e=>e.date).sort();
  let streak = 0;
  let windowEnd = todayISO();
  while(true){
    const windowStart = addDaysISO(windowEnd, -6);
    const hasEntry = dates.some(d=> d>=windowStart && d<=windowEnd);
    if(!hasEntry) break;
    streak++;
    windowEnd = addDaysISO(windowStart, -1);
    if(streak>520) break; // safety
  }
  return streak;
}
function overallTaskCompletion(){
  let total=0, done=0;
  state.projects.forEach(p=>{ total+=p.tasks.length; done+=p.tasks.filter(t=>t.done).length; });
  return total? Math.round(done/total*100) : 0;
}

/* =======================================================
   TAB SWITCHING
======================================================= */
let currentTab = 'projects';
let projectDetailId = null;
let calState = { year:new Date().getFullYear(), month:new Date().getMonth(), selectedDay:null };

function switchTab(tab){
  currentTab = tab;
  projectDetailId = null;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===tab);
  });
  render();
}

function jumpTo(tab, opts){
  opts = opts || {};
  if(tab==='projects' && opts.projectId){
    switchTab('projects');
    projectDetailId = opts.projectId;
    render();
    return;
  }
  switchTab(tab);
}

function render(){
  renderHeaderStats();
  const main = document.getElementById('mainContent');
  if(currentTab==='projects'){
    main.innerHTML = projectDetailId ? renderProjectDetail(projectDetailId) : renderProjectsTab();
  } else if(currentTab==='week'){
    main.innerHTML = renderWeekTab();
  } else if(currentTab==='calendar'){
    main.innerHTML = renderCalendarTab();
  } else if(currentTab==='weight'){
    main.innerHTML = renderWeightTab();
  } else if(currentTab==='shots'){
    main.innerHTML = renderShotsTab();
  } else if(currentTab==='goals'){
    main.innerHTML = renderGoalsTab();
  }
}

/* =======================================================
   NEEDS ATTENTION PANEL (shared, used on Projects tab)
======================================================= */
function renderAttentionPanel(){
  const taskItems = allUrgentOrSoonTasks();
  const goalItems = soonGoals();
  const sReminder = shotReminder();
  const wReminder = weighReminder();

  let rows = '';
  taskItems.forEach(({project,task})=>{
    const overdue = task.due && isOverdue(task.due);
    const badge = task.due ? `<span class="badge ${overdue?'overdue':''}">${overdue?'Overdue':formatDateShort(task.due)}</span>` : '';
    rows += `<div class="attn-item" onclick="jumpTo('projects',{projectId:'${project.id}'})">
      <span class="tag tag-task">${escapeHtml(project.name)}</span>
      <span class="attn-text">${escapeHtml(task.text)}</span>
      ${badge}
    </div>`;
  });
  goalItems.forEach(g=>{
    const overdue = isOverdue(g.targetDate);
    rows += `<div class="attn-item" onclick="jumpTo('goals')">
      <span class="tag tag-goal">Goal</span>
      <span class="attn-text">${escapeHtml(g.title)}</span>
      <span class="badge ${overdue?'overdue':''}">${overdue?'Overdue':formatDateShort(g.targetDate)}</span>
    </div>`;
  });
  if(sReminder){
    rows += `<div class="attn-item" onclick="jumpTo('shots')">
      <span class="tag tag-reminder">Shot</span>
      <span class="attn-text">${escapeHtml(sReminder.text)}</span>
      ${sReminder.overdue?'<span class="badge overdue">Overdue</span>':''}
    </div>`;
  }
  if(wReminder){
    rows += `<div class="attn-item" onclick="jumpTo('weight')">
      <span class="tag tag-reminder">Weigh-in</span>
      <span class="attn-text">${escapeHtml(wReminder.text)}</span>
      ${wReminder.overdue?'<span class="badge overdue">Overdue</span>':''}
    </div>`;
  }

  if(!rows) rows = `<div class="empty-msg">Nothing urgent right now.</div>`;

  return `<div class="panel">
    <h2 class="section-title">Needs Attention</h2>
    <div class="attn-list">${rows}</div>
  </div>`;
}

/* =======================================================
   PROJECTS TAB
======================================================= */
function renderProjectsTab(){
  let cards = '';
  state.projects.forEach(p=>{
    const prog = projectProgress(p);
    const overdue = projectOverdueCount(p);
    const colorVar = NOTE_COLOR_VARS[p.color % NOTE_COLOR_VARS.length];
    const angle = (hashCode(p.id) % 7) - 3;
    cards += `<div class="sticky" style="background:var(${colorVar}); transform:rotate(${angle}deg);" onclick="openProject('${p.id}')">
      ${overdue? `<div class="overdue-flag">${overdue} overdue</div>`:''}
      <div class="pin">📍</div>
      <h3>${escapeHtml(p.name)}</h3>
      <div class="note-sub">${prog.done} of ${prog.total} tasks done · ${prog.pct}%</div>
      <div class="progress-track"><div class="progress-fill" style="width:${prog.pct}%"></div></div>
    </div>`;
  });
  if(!state.projects.length){
    cards = `<div class="empty-msg">No projects yet — pin your first one to the board.</div>`;
  }
  return `
    ${renderAttentionPanel()}
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <h2 class="section-title" style="margin:0;">Projects</h2>
        <button class="jelly small" onclick="openNewProjectModal()">+ New project</button>
      </div>
      <div class="note-grid">${cards}</div>
    </div>
  `;
}

function hashCode(str){
  let h=0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function openNewProjectModal(){
  const colorSwatches = NOTE_COLOR_VARS.map((v,i)=>
    `<div class="swatch ${i===0?'selected':''}" data-idx="${i}" style="background:var(${v})" onclick="selectSwatch(this)"></div>`
  ).join('');
  showModal('New Project', `
    <div class="modal-field">
      <label>Project name</label>
      <input type="text" id="newProjName" placeholder="e.g. Kitchen Remodel">
    </div>
    <div class="modal-field">
      <label>Color</label>
      <div class="swatch-picker">${colorSwatches}</div>
    </div>
  `, `
    <button class="jelly ghost small" onclick="closeModal()">Cancel</button>
    <button class="jelly small" onclick="createProject()">Create</button>
  `);
  setTimeout(()=>document.getElementById('newProjName')?.focus(), 50);
}
function selectSwatch(el){
  el.parentElement.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected');
}
function createProject(){
  const name = document.getElementById('newProjName').value.trim();
  if(!name) return;
  const selectedSwatch = document.querySelector('.swatch.selected');
  const color = selectedSwatch ? Number(selectedSwatch.dataset.idx) : 0;
  state.projects.push({id:uid(), name, color, tasks:[]});
  saveState();
  closeModal();
  render();
}

function openProject(id){
  projectDetailId = id;
  render();
}

function renderProjectDetail(id){
  const p = state.projects.find(x=>x.id===id);
  if(!p){ projectDetailId=null; return renderProjectsTab(); }
  const prog = projectProgress(p);
  const sortedTasks = [...p.tasks].sort((a,b)=>{
    if(a.done !== b.done) return a.done? 1 : -1;
    if(!a.due && !b.due) return 0;
    if(!a.due) return 1;
    if(!b.due) return -1;
    return a.due < b.due ? -1 : 1;
  });
  let taskRows = sortedTasks.map(t=>{
    const overdue = !t.done && t.due && isOverdue(t.due);
    return `<div class="task-row ${t.done?'done':''}">
      <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${p.id}','${t.id}')">
      <span class="task-text">${escapeHtml(t.text)}</span>
      ${t.urgent? '<span class="pill urgent">Urgent</span>':''}
      ${t.repeat==='weekly'? '<span title="Repeats weekly">🔁</span>':''}
      ${t.due? `<span class="badge ${overdue?'overdue':''}">${overdue?'Overdue · ':''}${formatDateShort(t.due)}</span>`:''}
      <button class="icon-btn" title="Delete task" onclick="deleteTask('${p.id}','${t.id}')">🗑️</button>
    </div>`;
  }).join('');
  if(!sortedTasks.length) taskRows = `<div class="empty-msg">No tasks yet.</div>`;

  return `
    <div class="panel">
      <button class="jelly ghost small back-btn" onclick="projectDetailId=null; render();">← Back to projects</button>
      <div class="detail-header" style="margin-top:12px;">
        <h2>${escapeHtml(p.name)}</h2>
        <button class="jelly ghost small" onclick="openRenameProjectModal('${p.id}')">Rename</button>
        <button class="jelly danger small" onclick="deleteProjectConfirm('${p.id}')">Delete</button>
      </div>
      <div class="note-sub" style="margin-bottom:6px;">${prog.done} of ${prog.total} tasks done · ${prog.pct}%</div>
      <div class="progress-track" style="margin-bottom:16px;"><div class="progress-fill" style="width:${prog.pct}%;background:var(${NOTE_COLOR_VARS[p.color%6]});opacity:1;"></div></div>

      <div class="task-add-row">
        <input type="text" id="newTaskText" placeholder="Add a task...">
        <input type="date" id="newTaskDue">
        <label class="chk"><input type="checkbox" id="newTaskUrgent"> Urgent</label>
        <select id="newTaskRepeat">
          <option value="none">Repeat: None</option>
          <option value="weekly">Repeat: Weekly</option>
        </select>
        <button class="jelly small" onclick="addTask('${p.id}')">Add</button>
      </div>

      <div class="task-list">${taskRows}</div>
    </div>
  `;
}

function openRenameProjectModal(id){
  const p = state.projects.find(x=>x.id===id);
  showModal('Rename Project', `
    <div class="modal-field">
      <label>Project name</label>
      <input type="text" id="renameProjName" value="${escapeHtml(p.name)}">
    </div>
  `, `
    <button class="jelly ghost small" onclick="closeModal()">Cancel</button>
    <button class="jelly small" onclick="renameProject('${id}')">Save</button>
  `);
  setTimeout(()=>document.getElementById('renameProjName')?.focus(), 50);
}
function renameProject(id){
  const name = document.getElementById('renameProjName').value.trim();
  if(!name) return;
  const p = state.projects.find(x=>x.id===id);
  p.name = name;
  saveState();
  closeModal();
  render();
}
function deleteProjectConfirm(id){
  const p = state.projects.find(x=>x.id===id);
  confirmModal(`Delete "${p.name}" and all its tasks? This can't be undone.`, ()=>{
    state.projects = state.projects.filter(x=>x.id!==id);
    saveState();
    projectDetailId = null;
    render();
  });
}
function addTask(projectId){
  const text = document.getElementById('newTaskText').value.trim();
  if(!text) return;
  const due = document.getElementById('newTaskDue').value || null;
  const urgent = document.getElementById('newTaskUrgent').checked;
  const repeat = document.getElementById('newTaskRepeat').value;
  const p = state.projects.find(x=>x.id===projectId);
  p.tasks.push({id:uid(), text, done:false, due, urgent, repeat});
  saveState();
  render();
}
function toggleTask(projectId, taskId){
  const p = state.projects.find(x=>x.id===projectId);
  const t = p.tasks.find(x=>x.id===taskId);
  t.done = !t.done;
  if(t.done && t.repeat==='weekly'){
    const nextDue = t.due ? addDaysISO(t.due, 7) : addDaysISO(todayISO(),7);
    p.tasks.push({id:uid(), text:t.text, done:false, due:nextDue, urgent:t.urgent, repeat:'weekly'});
  }
  saveState();
  render();
}
function deleteTask(projectId, taskId){
  const p = state.projects.find(x=>x.id===projectId);
  p.tasks = p.tasks.filter(x=>x.id!==taskId);
  saveState();
  render();
}

/* =======================================================
   THIS WEEK TAB
======================================================= */
function renderWeekTab(){
  const weightStreak = computeStreak(state.weight.entries);
  const shotStreak = computeStreak(state.shots.entries);

  const days = [];
  for(let i=0;i<7;i++){
    days.push(addDaysISO(todayISO(), i));
  }
  let tasksDueCount = 0, goalsDueCount = 0;

  let dayRows = days.map((iso, idx)=>{
    const label = idx===0? 'Today' : idx===1? 'Tomorrow' : dateFromISO(iso).toLocaleDateString(undefined,{weekday:'long'});
    let items = '';
    state.projects.forEach(p=>{
      p.tasks.forEach(t=>{
        if(!t.done && t.due===iso){
          tasksDueCount++;
          items += `<div class="day-item" onclick="jumpTo('projects',{projectId:'${p.id}'})">
            <span class="dot" style="background:var(${NOTE_COLOR_VARS[p.color%6]})"></span>
            ${escapeHtml(t.text)} <span style="color:var(--ink-soft);font-size:.78rem;">(${escapeHtml(p.name)})</span>
          </div>`;
        }
      });
    });
    state.goals.entries.forEach(g=>{
      if(g.progress<100 && g.targetDate===iso){
        goalsDueCount++;
        items += `<div class="day-item" onclick="jumpTo('goals')">
          <span class="dot" style="background:var(--success-2)"></span>
          Goal: ${escapeHtml(g.title)}
        </div>`;
      }
    });
    const shotLogged = state.shots.entries.some(e=>e.date===iso);
    const weighLogged = state.weight.entries.some(e=>e.date===iso);
    if(shotLogged){
      items += `<div class="day-item" onclick="jumpTo('shots')"><span class="dot" style="background:var(--danger-2)"></span> Shot logged</div>`;
    }
    if(weighLogged){
      items += `<div class="day-item" onclick="jumpTo('weight')"><span class="dot" style="background:var(--primary-2)"></span> Weigh-in logged</div>`;
    }
    if(!items) items = `<div class="empty-msg">Nothing scheduled.</div>`;
    return `<div class="day-row"><h4>${label} · ${formatDateShort(iso)}</h4><div class="day-items">${items}</div></div>`;
  }).join('');

  return `
    <div class="panel">
      <h2 class="section-title">This Week</h2>
      <div class="week-summary">
        <div class="summary-chip"><b>${tasksDueCount}</b><span>Tasks due</span></div>
        <div class="summary-chip"><b>${goalsDueCount}</b><span>Goals due</span></div>
        <div class="summary-chip"><b>🔥 ${weightStreak}</b><span>Weigh-in streak</span></div>
        <div class="summary-chip"><b>🔥 ${shotStreak}</b><span>Shot streak</span></div>
      </div>
      <div class="week-grid">${dayRows}</div>
    </div>
  `;
}

/* =======================================================
   CALENDAR TAB
======================================================= */
function renderCalendarTab(){
  const {year, month} = calState;
  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const monthLabel = firstOfMonth.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const weekdayLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  const cells = [];
  for(let i=0;i<startWeekday;i++){
    const dnum = daysInPrevMonth - startWeekday + i + 1;
    cells.push({dnum, faded:true, iso:null});
  }
  for(let d=1; d<=daysInMonth; d++){
    const iso = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    cells.push({dnum:d, faded:false, iso});
  }
  const remainder = (7 - (cells.length % 7)) % 7;
  for(let i=1;i<=remainder;i++){
    cells.push({dnum:i, faded:true, iso:null});
  }

  const todayIso = todayISO();

  let cellsHtml = cells.map(c=>{
    if(!c.iso){
      return `<div class="cal-cell faded"><div class="dnum">${c.dnum}</div></div>`;
    }
    let dots = '';
    state.projects.forEach(p=>{
      p.tasks.forEach(t=>{
        if(!t.done && t.due===c.iso){
          dots += `<span class="dot" style="background:var(${NOTE_COLOR_VARS[p.color%6]})"></span>`;
        }
      });
    });
    if(state.goals.entries.some(g=>g.progress<100 && g.targetDate===c.iso)){
      dots += `<span class="dot" style="background:var(--success-2)"></span>`;
    }
    if(state.shots.entries.some(e=>e.date===c.iso)){
      dots += `<span class="dot" style="background:var(--danger-2)"></span>`;
    }
    if(state.weight.entries.some(e=>e.date===c.iso)){
      dots += `<span class="dot" style="background:var(--primary-2)"></span>`;
    }
    const isToday = c.iso===todayIso;
    return `<div class="cal-cell ${isToday?'today':''}" onclick="selectCalDay('${c.iso}')">
      <div class="dnum">${c.dnum}</div>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }).join('');

  let detailHtml = '';
  if(calState.selectedDay){
    detailHtml = renderCalDayDetail(calState.selectedDay);
  }

  return `
    <div class="panel">
      <div class="cal-nav">
        <button class="jelly ghost small" onclick="calMonthShift(-1)">← Prev</button>
        <h3>${monthLabel}</h3>
        <div style="display:flex;gap:8px;">
          <button class="jelly ghost small" onclick="calGoToday()">Today</button>
          <button class="jelly ghost small" onclick="calMonthShift(1)">Next →</button>
        </div>
      </div>
      <div class="cal-grid">
        ${weekdayLabels.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}
        ${cellsHtml}
      </div>
      ${detailHtml}
    </div>
  `;
}
function calMonthShift(delta){
  let m = calState.month + delta;
  let y = calState.year;
  if(m<0){ m=11; y--; }
  if(m>11){ m=0; y++; }
  calState.month = m; calState.year = y;
  calState.selectedDay = null;
  render();
}
function calGoToday(){
  const d = new Date();
  calState.year = d.getFullYear();
  calState.month = d.getMonth();
  calState.selectedDay = todayISO();
  render();
}
function selectCalDay(iso){
  calState.selectedDay = iso;
  render();
}
function renderCalDayDetail(iso){
  let items = [];
  state.projects.forEach(p=>{
    p.tasks.forEach(t=>{
      if(!t.done && t.due===iso){
        items.push({label:`Task: ${t.text} (${p.name})`, onclick:`jumpTo('projects',{projectId:'${p.id}'})`});
      }
    });
  });
  state.goals.entries.forEach(g=>{
    if(g.progress<100 && g.targetDate===iso){
      items.push({label:`Goal: ${g.title}`, onclick:`jumpTo('goals')`});
    }
  });
  if(state.shots.entries.some(e=>e.date===iso)){
    items.push({label:'Shot logged', onclick:`jumpTo('shots')`});
  }
  if(state.weight.entries.some(e=>e.date===iso)){
    items.push({label:'Weigh-in logged', onclick:`jumpTo('weight')`});
  }
  const rows = items.length
    ? items.map(i=>`<div class="cal-detail-item" onclick="${i.onclick}">${escapeHtml(i.label)}</div>`).join('')
    : `<div class="empty-msg">Nothing on this day.</div>`;
  return `<div class="cal-detail"><h4 style="margin:0 0 8px;font-family:'Kalam';">${formatDateShort(iso)}</h4>${rows}</div>`;
}

function renderWeightTab(){
  const w = state.weight;
  const streak = computeStreak(w.entries);
  const unitLabel = w.unit==='lb' ? 'lb / in' : 'kg / cm';

  const sortedEntries = [...w.entries].sort((a,b)=> a.date<b.date? 1:-1);

  let goalCard;
  if(w.goal==null){
    goalCard = `
      <div class="card">
        <h3 style="margin-top:0;font-family:'Kalam';">Goal Weight</h3>
        <div class="field-row">
          <input type="number" id="goalInput" placeholder="Target weight" step="0.1">
          <button class="jelly small" onclick="setWeightGoal()">Set goal</button>
        </div>
      </div>`;
  } else {
    const first = sortedEntries[sortedEntries.length-1];
    const latest = sortedEntries[0];
    let pct = 0, remaining = 0;
    if(first && latest){
      const start = first.weight, current = latest.weight, target = w.goal;
      const totalDelta = target - start;
      const currentDelta = current - start;
      if(totalDelta === 0){
        pct = 100;
      } else {
        pct = Math.max(0, Math.min(100, Math.round((currentDelta/totalDelta)*100)));
      }
      remaining = Math.abs(target - current);
    }
    const reached = pct>=100;
    goalCard = `
      <div class="card">
        <h3 style="margin-top:0;font-family:'Kalam';">Goal Weight</h3>
        <div style="font-size:1.3rem;font-weight:700;">${w.goal} ${w.unit}</div>
        <div class="goal-progress-wrap">
          <div class="goal-progress-track"><div class="goal-progress-fill" style="width:${pct}%"></div></div>
          <div style="font-size:.82rem;color:var(--ink-soft);margin-top:4px;">
            ${reached? '🎉 Goal reached!' : `${remaining.toFixed(1)} ${w.unit} to go · ${pct}% there`}
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="jelly ghost small" onclick="openEditGoalModal()">Edit</button>
          <button class="jelly danger small" onclick="clearWeightGoalConfirm()">Clear</button>
        </div>
      </div>`;
  }

  let chartHtml = '';
  if(sortedEntries.length>=2){
    chartHtml = `<div class="card"><h3 style="margin-top:0;font-family:'Kalam';">Trend</h3>${renderTrendChart(sortedEntries)}</div>`;
  }

  let tableRows = sortedEntries.map(e=>{
    const measures = ['waist','hips','chest','arm','thigh'].filter(k=>e[k]!=null && e[k]!=='')
      .map(k=>`${k}: ${e[k]}`).join(', ');
    return `<tr>
      <td>${formatDateShort(e.date)}</td>
      <td>${e.weight} ${w.unit}</td>
      <td>${measures||'—'}</td>
      <td><button class="icon-btn" onclick="deleteWeightEntry('${e.id}')">🗑️</button></td>
    </tr>`;
  }).join('');
  if(!sortedEntries.length){
    tableRows = `<tr><td colspan="4" class="empty-msg">No entries logged yet.</td></tr>`;
  }

  return `
    <div class="panel">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;">
        <h2 class="section-title" style="margin:0;">Weight &amp; Measurements ${streak>0?`<span class="streak-badge">🔥 ${streak} week streak</span>`:''}</h2>
        <button class="jelly ghost small" onclick="toggleWeightUnit()">Units: ${unitLabel}</button>
      </div>

      <div class="card" style="margin-top:12px;">
        <div class="field-row">
          <label>Date <input type="date" id="wDate" value="${todayISO()}"></label>
          <label>Weight (${w.unit}) <input type="number" id="wWeight" step="0.1" placeholder="required"></label>
        </div>
        <details class="measure-toggle">
          <summary>+ Add measurements</summary>
          <div class="measure-grid">
            <label>Waist <input type="number" id="mWaist" step="0.1"></label>
            <label>Hips <input type="number" id="mHips" step="0.1"></label>
            <label>Chest <input type="number" id="mChest" step="0.1"></label>
            <label>Arm <input type="number" id="mArm" step="0.1"></label>
            <label>Thigh <input type="number" id="mThigh" step="0.1"></label>
          </div>
        </details>
        <button class="jelly small" style="margin-top:8px;" onclick="logWeightEntry()">Log entry</button>
      </div>

      <div class="card-row" style="margin-top:16px;">
        ${goalCard}
        ${chartHtml}
      </div>

      <table class="log-table" style="margin-top:16px;">
        <thead><tr><th>Date</th><th>Weight</th><th>Measurements</th><th></th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  `;
}

function renderTrendChart(sortedEntriesDesc){
  const entries = [...sortedEntriesDesc].sort((a,b)=> a.date<b.date? -1:1);
  const values = entries.map(e=>e.weight);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const W = 600, H = 120, pad = 20;
  const stepX = entries.length>1 ? (W-2*pad)/(entries.length-1) : 0;
  const pts = entries.map((e,i)=>{
    const x = pad + i*stepX;
    const y = H-pad - ((e.weight-min)/range)*(H-2*pad);
    return [x,y];
  });
  const pathD = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--primary-2)"></circle>`).join('');
  return `
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <path d="${pathD}" fill="none" stroke="var(--primary-2)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        ${dots}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-soft);">
        <span>${formatDateShort(entries[0].date)} · ${entries[0].weight}</span>
        <span>min ${min} / max ${max}</span>
        <span>${formatDateShort(entries[entries.length-1].date)} · ${entries[entries.length-1].weight}</span>
      </div>
    </div>
  `;
}

function zoneLabel(x,y){
  // x,y in 0-100 relative coords, center ~50,45
  const cx=50, cy=45;
  const top = y < cy;
  const left = x < cx;
  if(top && !left) return 'Zone 1 · upper right';
  if(top && left) return 'Zone 2 · upper left';
  if(!top && left) return 'Zone 3 · lower left';
  return 'Zone 4 · lower right';
}

  const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
  pendingShotCoords = {x: Math.round(svgP.x*10)/10, y: Math.round(svgP.y*10)/10};
  showModal('Log Shot', `

      <label>Date</label>

  `, `
    <button class="jelly ghost small" onclick="closeModal()">Cancel</button>
    <button class="jelly small" onclick="saveShotEntry()">Save</button>
  `);
}
function saveShotEntry(){
  if(!pendingShotCoords) return;
  const date = document.getElementById('shotDate').value || todayISO();
  const note = document.getElementById('shotNote').value.trim();
  state.shots.entries.push({id:uid(), x:pendingShotCoords.x, y:pendingShotCoords.y, date, note});

======================================================= */
function renderGoalsTab(){
  const sorted = [...state.goals.entries].sort((a,b)=>{
    const aDone = a.progress>=100, bDone = b.progress>=100;
    if(aDone!==bDone) return aDone? 1 : -1;
    if(!a.targetDate && !b.targetDate) return 0;
    if(!a.targetDate) return 1;
    if(!b.targetDate) return -1;
    return a.targetDate < b.targetDate ? -1 : 1;
  });

  let rows = sorted.map(g=>{
    const overdue = g.progress<100 && g.targetDate && isOverdue(g.targetDate);
    const completed = g.progress>=100;
    return `<div class="goal-row ${completed?'completed':''}">
      <div class="goal-row-top">
        <span class="goal-title">${escapeHtml(g.title)}</span>
        ${g.targetDate? `<span class="badge ${overdue?'overdue':''}">${overdue?'Overdue':formatDateShort(g.targetDate)}</span>`:''}
        <button class="icon-btn" onclick="deleteGoalConfirm('${g.id}')">🗑️</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <input type="range" min="0" max="100" value="${g.progress}" oninput="updateGoalProgress('${g.id}', this.value, this.previousElementSibling)" onchange="updateGoalProgress('${g.id}', this.value)">
        <span class="goal-pct" id="pct-${g.id}">${g.progress>=100? '✓ Done' : g.progress+'%'}</span>
      </div>
    </div>`;
  }).join('');
  if(!sorted.length) rows = `<div class="empty-msg">No goals yet — add one below.</div>`;

  return `
    <div class="panel">
      <h2 class="section-title">Goals</h2>
      <div class="task-add-row">
        <input type="text" id="newGoalTitle" placeholder="Goal title...">
        <input type="date" id="newGoalDate">
        <button class="jelly small" onclick="addGoal()">Add goal</button>
      </div>
      ${rows}
    </div>
  `;
}
function addGoal(){
  const title = document.getElementById('newGoalTitle').value.trim();
  if(!title) return;
  const targetDate = document.getElementById('newGoalDate').value || null;
  state.goals.entries.push({id:uid(), title, targetDate, progress:0});
  saveState();
  render();
}
function updateGoalProgress(id, value){
  const g = state.goals.entries.find(x=>x.id===id);
  g.progress = Number(value);
  const pctEl = document.getElementById('pct-'+id);
  if(pctEl) pctEl.textContent = g.progress>=100? '✓ Done' : g.progress+'%';
  saveState();
  renderHeaderStats();
}
function deleteGoalConfirm(id){
  const g = state.goals.entries.find(x=>x.id===id);
  confirmModal(`Delete goal "${g.title}"?`, ()=>{
    state.goals.entries = state.goals.entries.filter(x=>x.id!==id);
    saveState();
    render();
  });
}

/* =======================================================
   BACKUP MODAL
======================================================= */
function openBackupModal(){
  showModal('Backup &amp; Restore', `
    <div style="margin-bottom:16px;">
      <h4 style="margin:0 0 6px;font-size:.9rem;">Export</h4>
      <p style="font-size:.82rem;color:var(--ink-soft);margin:0 0 8px;">Download everything as a single file you can keep or move to another browser.</p>
      <button class="jelly small" onclick="exportBackup()">⬇️ Export backup</button>
    </div>
    <div>
      <h4 style="margin:0 0 6px;font-size:.9rem;">Import</h4>
      <p style="font-size:.82rem;color:var(--ink-soft);margin:0 0 8px;">Choose a backup file to load. This replaces everything currently in the app.</p>
      <input type="file" id="importFile" accept="application/json">
      <div style="margin-top:10px;"><button class="jelly ghost small" onclick="startImport()">📂 Import backup</button></div>
    </div>
  `, `<button class="jelly ghost small" onclick="closeModal()">Close</button>`);
}
function exportBackup(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `project-command-center-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function startImport(){
  const fileInput = document.getElementById('importFile');
  const file = fileInput.files[0];
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      showModal('Import Failed', `<p style="font-size:.9rem;">That file isn't valid backup data.</p>`, `<button class="jelly small" onclick="closeModal()">OK</button>`);
      return;
    }
    confirmModal('Importing this file will replace everything currently in the app. Continue?', ()=>{
      state = Object.assign(defaultState(), parsed);
      state.weight = Object.assign({unit:'lb',goal:null,entries:[]}, parsed.weight||{});
      state.shots = Object.assign({entries:[],doses:[]}, parsed.shots||{});
      state.goals = Object.assign({entries:[]}, parsed.goals||{});
      applyTheme(state.theme || 'bulletin');
      saveState();
      closeModal();
      switchTab('projects');
    }, {okLabel:'Replace everything', title:'Replace all data?'});
  };
  reader.readAsText(file);
}

/* =======================================================
   INIT
======================================================= */
function init(){
  loadState();
  applyTheme(state.theme);
  document.querySelector('.tab-btn[data-tab="projects"]').classList.add('active');
  render();
}
init();
</script>
</body>
</html>
